name: focused-mac-ci
# Supplemental, focused macOS CI for migration source heads that cannot run the
# standard merge gate (merge conflicts / pending validation). Lives ONLY on
# branch perf/ci-migration, is called only by ci.yml for a manually dispatched
# run on that branch, and never gates, publishes or merges main. It runs focused `cargo test` subsets
# and reports honest results only: no GPU/UI/criterion benchmarks and no
# performance acceptance, not a replacement for the standard PR gate.
#
# Two mutually exclusive focused modes, chosen by the dispatch inputs:
#   pr_list (<=5 numeric fork PR numbers): the matrix job fetches each PR with
#     one READ-ONLY API GET (pull-requests: read), verifies it (open, head from
#     this repository, perf/* branch, current 40-hex sha) and emits sanitized
#     five-key packets; ci/materialize_packets.py revalidates them per matrix
#     entry. The report step posts the commit status on the exact tested sha,
#     and runner.py re-verifies branch tip == source_head at test time.
#   full_batch=true: the legacy committed-items batch (ci/gen_matrix.py over
#     ci/items/), now explicit only. Dispatching with no input runs nothing.
on:
  workflow_call:
    inputs:
      pr_list:
        description: >-
          Focused rerun: fork PR numbers, numeric only, separated by spaces or
          commas, max 5 distinct. Passed to the scripts as env data only.
        required: false
        type: string
        default: ''
      full_batch:
        description: >-
          Explicitly run the legacy full committed-items batch (ci/items/) —
          never combined with pr_list.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  # matrix job: read-only GET of the dispatched PRs; tests job: statuses.
  pull-requests: read
  statuses: write

concurrency:
  # One group per run: including github.run_id lets distinct targeted dispatch
  # batches on perf/ci-migration coexist (they no longer cancel each other and
  # lose tests). Same-head duplicate work is deduplicated by the manager at
  # dispatch time. max-parallel=3 still bounds each run's tests strategy.
  group: focused-mac-ci-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1 # matrix job reads only item JSON files; PR mode talks to the API
      # Inputs travel as env data only (never interpolated into the shell).
      # PR mode does one bounded, read-only GET per PR with the run token;
      # full_batch relays ci/gen_matrix.py over the committed packets;
      # no input runs nothing (count=0, tests job skips).
      - id: gen
        env:
          PR_LIST: ${{ inputs.pr_list }}
          FULL_BATCH: ${{ inputs.full_batch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: python3 ci/build_matrix.py ci/items >> "$GITHUB_OUTPUT"

  tests:
    needs: matrix
    if: needs.matrix.outputs.count != '0' # nothing pending -> nothing runs
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      # Full history (fetch-depth: 0): the verified merge-base -- main diff
      # needs ancestor commits; no partial/shallow shortcut is allowed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12" # runner needs tomllib (3.11+) for manifest parse
      # workflow_dispatch PR mode: materialize this entry's runtime packet.
      # $MATRIX/$ITEM_ID are env data; nothing is shell-evaluated. The script
      # revalidates the sanitized packet (runner.load_item contract) and the
      # entry's head == packet source_head. Batch items come from the checkout
      # and need no materialization.
      - name: Materialize focused packets for this entry
        env:
          MATRIX: ${{ needs.matrix.outputs.matrix }}
          ITEM_ID: ${{ matrix.id }}
        run: python3 ci/materialize_packets.py
      - name: Ensure stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
      # Registry-only cache, keyed by host OS only on purpose: no lockfile hash
      # (each tested SHA may carry its own lock) and NO target dir, so item
      # sources are always compiled fresh and no foreign head's test binary is
      # ever reused. Details in ci/README.md.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: focused-mac-registry-${{ runner.os }}
      - name: Run focused libtests for item ${{ matrix.id }} at ${{ matrix.head }}
        env:
          CARGO_BUILD_JOBS: "2" # shared Mac runners: cap concurrent cargo build jobs
        run: python3 ci/runner.py --item ${{ matrix.item }} --out ci-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: focused-mac-logs-${{ matrix.id }}
          path: ci-out/
          if-no-files-found: ignore
      # Commit status on the exact tested SHA. GH_TOKEN is present in THIS step
      # only (workflow grants statuses:write + contents:read). Commit statuses
      # have no neutral state, so a neutral result is reported as "failure"
      # with an honest description — never a fake pass.
      - name: Report commit status (focused-mac-ci)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ matrix.head }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          p=ci-out/status.json
          st=failure
          ds="focused Mac CI did not report a result"
          if [ -f "$p" ]; then
            st=$(jq -r '.state // "failure"' "$p")
            ds=$(jq -r '.desc // "did not complete"' "$p")
          fi
          if [ "$st" = neutral ]; then st=failure; fi
          gh api "repos/$REPO/statuses/$SHA" -f context=focused-mac-ci -f state="$st" -f target_url="$URL" -f description="$ds"
